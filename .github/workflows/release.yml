name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Expected a tag such as v1.0.0.' }
          "number=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - name: Install test dependency
        shell: pwsh
        run: |
          if (!(Get-Command svnadmin.exe -ErrorAction SilentlyContinue)) {
            choco install sliksvn --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Cannot install SlikSVN.' }
            'C:\Program Files\SlikSvn\bin' >> $env:GITHUB_PATH
          }
      - name: Build and test
        shell: pwsh
        run: |
          dotnet build SVNRevDesk.slnx -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          dotnet run --project tests/SVNRevDesk.IntegrationTests -c Release --no-build -- --portable-ci .build/release-tests/integration
          if ($LASTEXITCODE -ne 0) { throw 'Integration tests failed.' }
      - name: Package both runtime variants
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: ./scripts/Publish-Release.ps1 -Version $env:RELEASE_VERSION
      - name: Save packages
        uses: actions/upload-artifact@v4
        with:
          name: SVNRevDesk-${{ steps.version.outputs.number }}-win-x64
          path: |
            artifacts/releases/v${{ steps.version.outputs.number }}/*.zip
            artifacts/releases/v${{ steps.version.outputs.number }}/SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          $assets = @(Get-ChildItem "artifacts/releases/$env:RELEASE_TAG" -File | Where-Object { $_.Extension -eq '.zip' -or $_.Name -eq 'SHA256SUMS.txt' } | Select-Object -ExpandProperty FullName)
          if (Test-Path -LiteralPath $notes) {
            gh release create $env:RELEASE_TAG --verify-tag --title "SVNRevDesk $env:RELEASE_TAG" --notes-file $notes @assets
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --title "SVNRevDesk $env:RELEASE_TAG" --generate-notes @assets
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
