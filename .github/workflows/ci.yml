name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install SVN administration tools for disposable test repositories
        shell: pwsh
        run: |
          if (!(Get-Command svnadmin.exe -ErrorAction SilentlyContinue)) {
            choco install sliksvn --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Cannot install SlikSVN.' }
            'C:\Program Files\SlikSvn\bin' >> $env:GITHUB_PATH
          }
      - name: Build
        run: dotnet build SVNRevDesk.slnx -c Release --nologo
      - name: Integration tests against a real local SVN repository
        run: dotnet run --project tests/SVNRevDesk.IntegrationTests -c Release --no-build -- .build/ci/integration
      - name: Local ignore regression tests
        run: dotnet run --project tests/SVNRevDesk.IntegrationTests -c Release --no-build -- --ignore .build/ci/ignore
      - name: File move regression tests
        run: dotnet run --project tests/SVNRevDesk.IntegrationTests -c Release --no-build -- --file-move .build/ci/file-move
      - name: File transfer regression tests
        run: dotnet run --project tests/SVNRevDesk.IntegrationTests -c Release --no-build -- --file-transfer .build/ci/file-transfer
